<style>
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,sans-serif;margin:0;padding:16px}

</style></head><body>
<h1>📦 F1 多因子轮动 · 上线运营版</h1>
<div class="tabs"><a class="on" href="index.html">📊 运行状态</a><a href="manual.html">📖 使用说明</a><a href="../index.html">📦 箱体观察站（只看不动手）</a></div>
<div class="meta" id="meta">加载中…</div>
<div class="warnline">模拟数据·起步仓位 12.5%·请勿仅依赖本页决策</div>
<div class="line">⏱ 本页有两个时间，别看混：判定区=每天早上更新一次（09:25 判定轮）；快照区=每轮都更新</div>
<div id="decision" class="decision d-hold">加载中…</div>
<div class="stat" id="snapsec" style="display:none"><b>🕐 盘中快照（只读·不可操作）</b> <span class="badge" id="snapmeta"></span><div id="snap" style="margin-top:8px"></div></div>
<div class="stat"><b>🧭 现在该做什么</b><div id="sig" style="margin-top:8px"></div></div>
<div class="stat"><b>🚦 策略健康灯（与上面开关无关）</b><div id="bkall" style="margin-top:8px"></div><div id="bk" class="grid" style="margin-top:8px"></div></div>
<div class="stat" id="enhsec" style="display:none"><b>🧩 分域增强（F1 之外·独立小仓·参考非指令）</b><div id="enh" style="margin-top:8px"></div></div>
<div class="stat"><b>📒 三本账月报（不算费的账 / 费用账 / 跑输躺平的账）</b><div id="acct"></div></div>
<div class="stat"><b>📉 费拖累曲线（月度费用 % 权益）</b><div id="feecurve"></div><div id="feeline" class="line"></div></div>
<div class="stat"><b>🔍 监控明细</b><div id="mon"></div></div>
<footer id="foot"></footer>
<script>
let D=null;
function lamp(l){return '<span class="lamp '+(l==='green'?'g':l==='yellow'?'y':'r')+'"></span>'}
function pct(x,sgn){return (x>0&&sgn?'+':'')+x+'%'}
/* 阈值一律读 meta.breaker_thresholds（R13）：改引擎常量即可，HTML 不得写死任何数值 */
function fmtpct(v){return '−'+Math.abs(v*100).toFixed(0)+'%'}
function fmtpp(v){return '−'+Math.abs(v*100).toFixed(2)+'pp'}
function render(){
  const m=D.meta,s=D.signal,b=D.breakers,st=D.state||{};
  const T=m.breaker_thresholds||{};
  const frozen=(st.freeze_days_left||0)>0;
  document.getElementById('meta').innerHTML='判定数据：生成于 '+m.generated+' · 数据截至 '+s.asof+
    ' · <span class="badge">仓位档：第'+((st.tier_idx||0)+1)+'档/共'+m.tier_table_pct_per_stock.length+'档（最重档=第1档）· 单票 '+s.slot_per_stock_pct+'% · 总上限 '+s.total_exposure_pct+'%</span>'+
    (T.CB1?'<span class="badge">熔断阈值：'+m.calib_epoch+' 重标定 · '+m.total_exposure_pct+'% 敞口口径</span>':'')+
    (frozen?'<span class="badge" style="border-color:#f59e0b;color:#f59e0b">🧊 冻结开新仓：剩 '+st.freeze_days_left+' 个交易日（至 '+st.freeze_until_date+'）</span>':'')+
    '<span class="badge">判定数据：asof '+s.asof+'（每天 09:25 判定轮更新，一天只变一次）</span>'+
    ' · <a href="manual.html">📖 怎么用这份页面？看使用说明</a>';
  /* ---- UI-01 决策条：聚合优先级 熔断红灯＞闸关闭＞正常持仓 ---- */
  const dec=document.getElementById('decision');
  const red=b.overall.light==='red', yellow=b.overall.light==='yellow';
  let dcls,dtext,dsub;
  if(red){
    dcls='d-act';
    dtext='当前状态：动作中 — '+b.overall.action;
    dsub=(frozen?'冻结期内不买任何新票（剩 '+st.freeze_days_left+' 个交易日，至 '+st.freeze_until_date+'）。':'')+
      '市场总开关：'+(s.gate.on_holdcash?'已关闭（空仓观望）。':'开放。')+'动作完成后自动恢复；升档需人工复核。';
  }else if(frozen){
    dcls='d-act';
    dtext='当前状态：冻结中 — 暂停开新仓（剩 '+st.freeze_days_left+' 个交易日，至 '+st.freeze_until_date+'）';
    dsub='CB2 冻结期内不买任何新票：下面名单为冻结前最后一期排名，仅供观察。存量持仓按止损/崩市/换仓规则照常退出；到期自动恢复。';
  }else if(s.gate.on_holdcash){
    dcls='d-cash';
    dtext='当前状态：空仓观望';
    dsub='市场总开关已关闭：池均价 '+s.gate.idx+' 低于其 50 日平均线 '+s.gate.ma50+' → 不出新仓，等均价重新站上 50 日线后自动恢复。老仓位按止损/崩市/换仓规则照常退出（不是立即全部卖出）。';
  }else{
    dcls='d-hold';
    dtext='当前状态：本周持有下列 '+(s.top5||[]).length+' 只，各 '+s.slot_per_stock_pct+'%';
    dsub='下期信号：周首个交易日收盘（多为周一），次日开盘成交。'+(yellow?'健康灯有黄灯预警（见下），暂不动手。':'');
  }
  dec.className='decision '+dcls;
  dec.innerHTML=dtext+'<div class="sub">'+dsub+'</div>';
  /* ---- 信号区「现在该做什么」---- */
  const sg=document.getElementById('sig');
  let h='<div class="card '+(s.gate.on_holdcash?'cash':'hold')+'"><span class="tk">'+
    (s.gate.on_holdcash?'🟥 市场总开关：已关闭（空仓观望）':'🟩 市场总开关：开放 · 本期建议名单（top-5 等权，单票 '+s.slot_per_stock_pct+'%）')+'</span>'+
    '<div class="line">'+(s.gate.on_holdcash
      ?'当前池均价 '+s.gate.idx+'，低于其 50 日平均线 '+s.gate.ma50+' → 本周不出新仓；等均价重新站上 50 日线后自动恢复（原始术语：regime 闸，idx=144 只池内标的等权均价）'
      :'信号日 '+s.asof+(s.is_signal_day?'（今日为周信号日）':'（非信号日，下期信号以周首个交易日收盘为准）')+' · '+s.signal_rule)+'</div></div>';
  if(s.crash_check&&s.crash_check.triggered){
    h+='<div class="warnline">⚠️ 崩市检测：池中位 '+(-s.crash_check.pool_med_ret*100).toFixed(2)+'% 跌幅 &lt; −5% 线，次日开盘清仓（池里一半以上标的单日暴跌）</div>';
  }
  if(s.gate.on_holdcash){
    h+='<div class="line" style="margin:6px 0">以下为参考排名，<b style="color:#e6edf3">当前不建仓</b>；开关恢复后下一信号日按此优先：</div>';
  }else if(frozen){
    h+='<div class="line" style="margin:6px 0">以下为冻结前最后一期排名，仅供观察，恢复后下一信号日按此优先：</div>';
  }
  (s.top5||[]).forEach((c,i)=>{
    const lab=s.gate.on_holdcash?'<span class="sell">[闸门关闭·不开仓]</span>'
      :frozen?'<span class="sell">🧊 冻结中·不开新仓</span>'
      :'<span class="buy">[目标仓 '+s.slot_per_stock_pct+'%]</span>';
    h+='<div class="card '+(s.gate.on_holdcash?'cash':'hold')+'"><span class="tk">'+(i+1)+'. '+c.sym+'</span> '+
      lab+
      '<div class="line">综合评分 '+c.score+'（比池里其他票强多少的相对分）· 组成：均线斜率+量能斜率+距一年高点+近一月涨幅 · 成交口径：信号次日开盘</div></div>';});
  sg.innerHTML=h;
  /* ---- 健康灯 ---- */
  const names={'CB1':'回撤闸','CB2':'止损闸','CB3':'频次观察','FEE':'费用闸'};
  const CN={'green':'正常','yellow':'预警','red':'动作中'};
  const ol=b.overall.light;
  document.getElementById('bkall').innerHTML=
    '<span class="biglamp '+(ol==='green'?'g':ol==='yellow'?'y':'r')+'"></span>'+
    '<span style="font-size:17px;font-weight:bold">健康总灯：'+CN[ol]+'</span> · 建议：'+b.overall.action+
    '<details><summary>触发时会怎样（展开）</summary>降档顺序（单票）：'+m.tier_table_pct_per_stock.join('% → ')+'%；止损闸触发=暂停开新仓 20 个交易日；降档自动、升档人工复核解锁。'+(m.state_note||'')+'</details>';
  const bk=document.getElementById('bk');bk.innerHTML='';
  b.items.forEach(x=>{
    const d=x.detail;
    let cn='';
    if(x.name==='CB1')cn='近 20 日净值最大回撤 '+(d*100).toFixed(2)+'%（回撤闸：≤'+fmtpct(T.CB1.red)+' 降一档；≤'+fmtpct(T.CB1.yellow)+' 黄灯观察）';
    else if(x.name==='CB2')cn='近 60 日：止损 '+d.stop_count_60d+' 次 · 合计失血 '+(d.stop_pnl_sum_60d*100).toFixed(1)+'pp · 毛账 '+(d.gross_60d_pct*100).toFixed(1)+'% · 净账 '+(d.net_60d_pct*100).toFixed(1)+'%（止损闸：≤'+fmtpp(T.CB2.red)+' 毛账触发+净账确认；≤'+fmtpp(T.CB2.yellow)+' 观察）';
    else if(x.name==='CB3')cn='近 60 日止损 '+d.stop_count_60d+' 次 / 观察线 '+(+d.line).toFixed(2)+' 次（基准 '+(+d.baseline_60d).toFixed(2)+'×'+d.mult+'，只观察不动仓）';
    else if(x.name==='FEE')cn='近 60 日费用折年化 '+(d.fee_ann_pct*100).toFixed(2)+'% / 红线 '+(T.FEE.red*100).toFixed(2)+'%（黄线 '+(T.FEE.yellow*100).toFixed(2)+'% 预警）';
    bk.insertAdjacentHTML('beforeend','<div class="card" style="border-left:4px solid '+(x.light==='green'?'#16a34a':x.light==='yellow'?'#f59e0b':'#f85149')+'">'+
      lamp(x.light)+'<b>'+names[x.name]+'</b> <small style="color:#8b949e">'+x.name+'</small>'+
      '<div class="line">'+x.action+'</div><div class="line">'+cn+'</div>'+
      '<details><summary>原始字段（对账用）</summary><code style="word-break:break-all">'+(typeof d==='object'?JSON.stringify(d):d)+'</code></details></div>');});
  /* ---- 三本账 ---- */
  const a=document.getElementById('acct');
  let t='<table><tr><th>月份</th><th>毛账%（不算费）</th><th>净账%（扣完费）</th><th>费用%</th><th>基准：144 只等权躺着不动%</th><th>跑输躺平(+)/跑赢躺平(−)</th></tr>';
  const rows=D.monthly_accounts.slice().reverse();
  rows.slice(0,3).forEach(r=>{t+=acctRow(r);});
  t+='</table>';
  if(rows.length>3){
    let t2='<table>';rows.slice(3).forEach(r=>{t2+=acctRow(r);});t2+='</table>';
    t+='<details><summary>更早月份（展开 '+rows.slice(3).length+' 个月）</summary>'+t2+'</details>';
  }
  a.innerHTML=t+'<div class="line">跑输/跑赢躺平 = 池等权买入持有 − 策略毛账：正数=这段时间拿着不动反而更好（策略跑输），负数=策略跑赢躺平持有。费用=滑点 0.05%/边+资金费 0.03%/bar 合计。</div>';
  /* ---- 费拖累曲线 ---- */
  const fc=D.fee_curve, w=640,ht=90;
  const feeItem=b.items.find(x=>x.name==='FEE');
  if(fc.length>1&&feeItem){
    const mx=Math.max(...fc.map(x=>x.fee_pct),0.01);
    const pts=fc.map((x,i)=>(i/(fc.length-1)*w).toFixed(1)+','+(ht-6-x.fee_pct/mx*(ht-16)).toFixed(1)).join(' ');
    document.getElementById('feecurve').innerHTML='<svg viewBox="0 0 '+w+' '+ht+'" style="width:100%;background:#0d1117;border-radius:6px">'+
      '<polyline points="'+pts+'" fill="none" stroke="#f59e0b" stroke-width="2"/>'+
      '<text x="4" y="12" fill="#8b949e" font-size="10">max '+mx.toFixed(3)+'%</text></svg>';
    const fd=feeItem.detail;
    document.getElementById('feeline').textContent='费用警戒线：近 60 日费用折年化 ≥'+(T.FEE.red*100).toFixed(2)+'% → 降一档（黄线 '+(T.FEE.yellow*100).toFixed(2)+'%）；当前 '+(fd.fee_ann_pct*100).toFixed(2)+'%。月度费用含滑点 0.05%/边+资金费 0.03%/bar。阈值随引擎常量（breakers.items[FEE].detail.line_ann_pct）自动跟随，页面不写死数值。';
  }
  /* ---- 监控明细 ---- */
  const mo=D.monitor,re=mo.recent_stops||[];
  let mt='<table><tr><th>日期</th><th>标的</th><th>卖出价</th><th>收益</th><th>卖出类型</th></tr>';
  re.slice().reverse().forEach(x=>{
    mt+='<tr><td>'+x.date+'</td><td>'+x.sym+'</td><td>'+x.px+'</td>'+
      '<td class="dn">'+(x.pnl_pct*100).toFixed(2)+'%</td><td>'+(x.kind==='stop_gap'?'开盘跳空直接低过止损价，按开盘价卖出':'盘中触及止损价，按止损价卖出')+'</td></tr>';});
  document.getElementById('mon').innerHTML=(re.length?mt+'</table>':'<div class="line">回放期无止损事件</div>')+
    '<div class="warnline">止损线是 −8%（相对买入价）；跳空日实际亏损可能更大（例：2026-09-09 GPRO 实亏 −12.2%）——开盘价已低于止损价时只能按开盘价卖，这是口径内的正常损耗，不要因为「卖低了」而不卖。</div>'+
    '<div class="line">月报每月首个交易日随信号更新 · 详细口径见页底技术详情；各术语见说明书 §9 词典</div>';
  /* ---- 🧩 分域增强（PLAN_FINAL_20261021 新制：卡片数据源=meta.enhancement.cells，档位数字一律读 JSON 不写死；无字段显示「增强层未上线」不报错）---- */
  renderEnhancement(m);
  /* ---- 页脚：技术详情折叠 + 免责声明降级 ---- */
  document.getElementById('foot').innerHTML=
    '<details><summary>技术详情（seed / sha256 / 口径 / 复现命令）</summary>'+
    'seed='+m.seed+' · 引擎 sha256 <code>'+m.engine_sha256.slice(0,16)+'…</code> · 池='+m.pool_n+' 标的 · '+
    '历史模拟（非实盘）：回放 '+m.replay.start+'~'+m.replay.end+'，同期资金翻 '+m.replay.eq_net.toFixed(2)+' 倍（即 '+((m.replay.eq_net-1)*100).toFixed(1)+'%，含费）· '+
    '口径：'+m.caliber+' · CB3 频次基准（v1 冻结快照）='+m.cb3_baseline_60d+
    ' · live 重算对账参考='+m.cb3_baseline_recomputed+(m.cb3_baseline_drift_alert?'（⚠️ 偏差超 ±10%，请人工复核）':'')+'<br>'+
    '熔断阈值表（读自 meta.breaker_thresholds，页面无写死）：'+
    (T.CB1?('CB1 红'+fmtpct(T.CB1.red)+'/黄'+fmtpct(T.CB1.yellow)+' · CB2 红'+fmtpp(T.CB2.red)+'/黄'+fmtpp(T.CB2.yellow)+
      ' · CB3 '+(+T.CB3.line).toFixed(2)+'次 · 费线 红'+(T.FEE.red*100).toFixed(2)+'pp/黄'+(T.FEE.yellow*100).toFixed(2)+'pp'):'缺失')+
    ' · '+(m.calib_note||'')+'<br>'+
    '监控口径注释：'+(D.monitor.notes||[]).join(' · ')+'<br>'+
    '复现：PYTHONHASHSEED=42 python3 /workspace/repo_ready/engine_f1/f1_signal.py live（先 /tmp/wtc/refresh_cache.py 刷缓存）'+
    ' · 引擎锁定：repo_ready/engine_f1/f1_signal.py · 验收：DEPLOY_REPORT.md</details>'+
    '<details><summary>诚实声明（完整版）</summary>⚠️ 诚实声明（R11\' 上线方案）：F1 base 裸奔四因子带闸版，回测含幸存者偏差（池=当前存续票，已被现实证明活着的票），真实收益会打折；收益与池贝塔强相关。上线起步仓位仅 12.5%（单票 2.5%），熔断降档自动、升档由人工复核后解锁。本页为本机信号引擎输出：口径=V2 可实现出场（成交价按你真实下单能拿到的价格）+ 滑点 0.05%/边 + 资金费 0.03%/bar。仓位与买卖决策请勿仅依赖本页。</details>';
}
/* ---- 🧩 分域增强渲染（PLAN_FINAL_20261021 §2.1#1/#4 新制口径：排序 S1→S2→S3→S5→S4；
        tier ∈ {FULL,POOL_CAP,FROZEN,OFFLINE}；数值一律从 JSON 填充，HTML 不写死档位数字；
        无字段显示「增强层未上线」不报错）---- */
function renderEnhancement(m){
  const sec=document.getElementById('enhsec'),box=document.getElementById('enh');
  sec.style.display='';
  const E=m.enhancement;
  if(!E||!E.cells){box.innerHTML='<div class="line">增强层未上线</div>'+(E&&E.deploy_rule?'<div class="line">'+E.deploy_rule+'</div>':'');return;}
  let h='';
  if(E.deploy_rule)h+='<div class="line">部署铁律：'+E.deploy_rule+'</div>';
  const gen=E.generated||E.asof||'';
  const ageH=(Date.now()-new Date(gen.replace(' ','T')).getTime())/36e5;
  if(!isNaN(ageH)&&ageH>48)
    h+='<div class="warnline">⚠ 增强层数据未更新（最后：'+gen+'）——档位冻结按旧值执行</div>';
  const lk=E.linkage||{};
  h+='<div class="line">联动（单向让位·冲突一律听 F1）：F1 市场总开关='+(lk.f1_gate==='closed'?'关闭':'开放')+
     ' · F1 健康总灯='+(lk.f1_breaker_light||'未知')+
     ' · 增强层冻结='+(lk.enhanced_frozen?'是（冻结开新仓）':'否')+'</div>';
  const TIER_BADGE={'FULL':'g','POOL_CAP':'g','FROZEN':'y','OFFLINE':'r'};
  const ORDER=['S1','S2','S3','S5','S4'];
  ORDER.forEach(cid=>{
    const c=E.cells[cid];if(!c)return;
    const coef=c.coef,tn=c.tier_name||('档位'+(c.tier||'')),n=(c.n_days==null?'—':c.n_days);
    /* 新制文案（PLAN_FINAL §2.1#4 逐字）：数值一律从 JSON 填充 */
    let base;
    if(cid==='S1')base='反转·弱躁域｜当前：'+tn+' '+coef+'%｜单池满额 '+coef+'%·双池解锁另议｜仅当弱躁域激活时有意义｜单池证据·置信上限 50%';
    else if(cid==='S2')base='反转粗筛·弱躁域｜当前：'+tn+' '+coef+'%｜单池满额 '+coef+'%·双池解锁另议｜仅当弱躁域激活时有意义｜单池证据·置信上限 50%';
    else if(cid==='S3')base='突破回踩·牛躁域｜当前：'+tn+' '+coef+'%｜单池满额 '+coef+'%·双池解锁另议｜仅当牛躁域激活时有意义｜单池证据·置信上限 50%';
    else if(cid==='S5')base='fd 出场增强·全域｜当前：'+tn+' '+coef+'%（0.5% 基线×'+coef+'%）｜'+(c.tier==='FULL'?'满额运行·执照复审 '+(c.review_due||'—')+' 到期':'')+'｜作用于本层持仓出场，不动 F1 持仓';
    else if(cid==='S4'){const nd=(c.n_need||60)-(c.n_days||0);
      base='高波停门·弱稳域｜补样中（old131 '+(c.n_days==null?'—':c.n_days)+'/'+(c.n_need||60)+'，差 '+nd+' 天）｜样本门·未部署·不占用仓位';}
    /* 证据监控计数（执照复审数据源，非爬档）：S4 补样门计数除外 */
    const ev=(cid!=='S4')?'<div class="line">证据持续监控：n='+n+'（执照复审数据源，判读封印与否见下方状态）</div>':'';
    /* 状态分支：封印切换＞劣化线下线（OFFLINE）＞基础文案；非激活态追加行 */
    let note;
    if(c.sealed&&cid!=='S4'){
      const concl=c.verdict==='PASS'?'达标（重重检测通过·满额部署）':'判死';
      const passPhrase=(c.verdict==='PASS')
        ?(cid==='S5'?'；满额运行·执照复审 '+(c.review_due||'—')+' 到期'
                    :'；单池满额 '+coef+'%·双池解锁另议')
        :'';
      note='本格判读已封印：结论='+concl+'，档位='+(c.tier||'')+passPhrase+'，判读全文见 shadow_readout_'+cid+'.json';
    }else if(c.tier==='OFFLINE'){
      note='⚠ 本格已触发实盘劣化线（n≥10 ∧ t≤−2 方向翻转）——当日归零下线，卡片转负事实展示；仅季度机械复判（同判线）可复活回满额';
    }else note=base;
    let card='<div class="card" style="border-left:4px solid '+(c.tier==='OFFLINE'?'#f85149':(c.tier==='FULL'||c.tier==='POOL_CAP')?'#16a34a':!c.deployed?'#30363d':'#f59e0b')+'">'+
      '<b>'+c.name+'</b> <span class="badge">'+c.domain+'</span>'+
      (c.deployed?' <span class="badge">部署档位：'+tn+' · '+coef+'%</span>'
                 :' <span class="badge">灰态·未部署</span>')+
      '<div class="line">当前域状态：'+(cid==='S4'?(c.status||'SUSPENDED'):(c.domain_active?'当前域激活':'当前域未激活（=FROZEN，本格读数冻结仅展示）'))+
      (c.sealed?' · 判读已封印':'')+'</div>'+
      '<div class="line">'+note+'</div>'+ev+
      (!c.domain_active&&cid!=='S4'&&!c.sealed&&c.tier!=='OFFLINE'?'<div class="line">当前域未激活——本格读数冻结，仅作展示，不产生信号</div>':'')+
      (c.status&&c.status.indexOf('安全侧默认')>=0?'<div class="line">'+c.status+'</div>':'')+
      '</div>';
    h+=card;});
  /* 总免责声明行（PLAN_FINAL §2.1#4 逐字） */
  h+='<div class="line">分域增强=F1 主引擎之外的实验插件层，按重重检测满额部署（无任何时间等待），实盘劣化线自动降停（n≥10 ∧ t≤−2 当日归零），6 个月强制复审；单格≤0.5%、合计≤2%；本区块不是买入指令、不构成 F1 榜单的一部分；两引擎冲突时一律听 F1；档位仅代表证据强度不代表收益承诺。</div>';
  if(E.fee_note)h+='<div class="line">'+E.fee_note+'</div>';
  box.innerHTML=h;
}
function acctRow(r){
  return '<tr><td>'+r.month+'</td><td class="'+(r.gross_pct>0?'up':'dn')+'">'+pct(r.gross_pct,1)+'</td>'+
    '<td class="'+(r.net_pct>0?'up':'dn')+'">'+pct(r.net_pct,1)+'</td><td>'+r.fee_pct+'</td>'+
    '<td class="'+(r.pool_pct>0?'up':'dn')+'">'+pct(r.pool_pct,1)+'</td>'+
    '<td class="neutral">'+pct(r.concede_pct,1)+'</td></tr>';
}
/* ---- 盘中快照区：只读展示，判定语义一律以判定区为准 ---- */
function renderSnap(snap){
  const m=snap.meta||{},s=snap.snapshot||{};
  let h='<div class="line">轮次：'+m.round_id+'（'+(m.round_semantic||'')+'）· '+(s.notice||'')+'</div>';
  const cw=s.crash_watch;
  if(cw&&typeof cw.pool_med_ret_intraday==='number')
    h+='<div class="line">崩市观察（预估，不触发动作）：池中位盘中 '+(cw.pool_med_ret_intraday*100>0?'+':'')+(cw.pool_med_ret_intraday*100).toFixed(2)+'% · '+(cw.triggered_estimate?'预估触发':'预估未触发')+'</div>';
  const bp=s.breaker_preview;
  if(bp&&bp.overall)
    h+='<div class="line">'+lamp(bp.overall.light)+'健康总灯预演：'+bp.overall.action+' · '+bp.kind+'（判定以「判定数据」为准）</div>';
  const hd=s.holdings||[];
  h+='<div class="line">持仓快照：'+(hd.length?hd.map(x=>x.sym||x).join('、'):'（空仓）')+'</div>';
  document.getElementById('snap').innerHTML=h;
}
fetch('f1_live.json?ts='+Date.now()).then(r=>r.json()).then(d=>{D=d;render();})
 .catch(e=>{document.getElementById('meta').textContent='数据加载失败：'+e});
/* 快照轮（20:30/00:30/04:30）产物：拉取失败显示「快照暂无」，不影响判定区 */
fetch('f1_live_intraday.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
 .then(snap=>{
   const sec=document.getElementById('snapsec');sec.style.display='';
   if(snap&&snap.meta&&snap.meta.mode==='intraday_snapshot'){
     document.getElementById('snapmeta').textContent='快照数据：'+snap.meta.generated+'（每轮更新·不可操作）';
     renderSnap(snap);
   }else{document.getElementById('snapmeta').textContent='快照暂无';}
 })
 .catch(e=>{document.getElementById('snapsec').style.display='';
   document.getElementById('snapmeta').textContent='快照暂无';});
