# daily_refresh — GitHub Actions 接管每日页面刷新（2026-10-18 用户已批方案）
#
# 四轮时间表（cron 用 UTC；北京 = UTC+8，无夏令时 DST，全年恒定 +8）：
#   北京 20:30 / 00:30 / 04:30  =  快照轮（f1_signal.py snapshot，只读盘中快照）
#   北京 08:30                  =  判定轮（f1_signal.py live 完整日K + 写状态 + top5
#                                  + 熔断判定 + 箱体页 generate_page.py）
#
# 快照轮说明（WO-R13-03）：禁写 f1_state.json、禁出 top5、禁覆盖 f1_live.json 判定字段，
# 只更新盘中展示数据 f1/f1_live_intraday.json。
# 美股休市日（周末/假日）快照轮拉不到新盘中数据属**正常**，生成器会退回最近落定 K
# 并标注 intraday=False，不算失败。
#
# 失败报警三层：
#   ① job 失败 → GitHub 默认向 watcher/作者发失败邮件；
#   ② push 重试 3 次（间隔 60s）仍失败 → 步骤显式 exit 1 触发 ①；
#   ③ fail_test 金丝雀（workflow_dispatch 手动触发）可一次性验证报警链路真能送达。
#
# 手动触发（Actions 页 → Run workflow）：
#   mode: snapshot / decision / auto（auto=按当前 UTC 时间就近判定轮次）
#   fail_test: true 时在最后一步故意 exit 1 —— 用于验证失败邮件能真发出的一次性金丝雀。

name: daily_refresh

on:
  schedule:
    - cron: '30 12 * * *'   # 北京 20:30 快照轮（round 20:30）
    - cron: '30 16 * * *'   # 北京 00:30 快照轮（round 00:30）
    - cron: '30 20 * * *'   # 北京 04:30 快照轮（round 04:30）
    - cron: '30 0  * * *'   # 北京 08:30 判定轮（live + 箱体页）
  workflow_dispatch:
    inputs:
      mode:
        description: '轮次模式：snapshot=快照轮 / decision=判定轮 / auto=按当前UTC就近判定'
        required: true
        default: 'auto'
        type: choice
        options: [snapshot, decision, auto]
      fail_test:
        description: '金丝雀：true 时最后一步故意 exit 1（验证失败邮件，一次性测试用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily_refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '42'
      # 行情缓存统一放 /tmp/box_cache（runner 全新，每轮由刷新步骤重建）
      BOX_CACHE_DIR: /tmp/box_cache
      F1_CACHE: /tmp/box_cache
      # B1 双保险：拉行情报告显式指仓库内路径（写入端 refresh_cache.py 与
      # 读取端"拉行情"步骤共用此值，不再依赖 /tmp/wtc 缺省目录存在）
      BOX_REFRESH_REPORT: ${{ github.workspace }}/engine_snapshot/refresh_report.json
      # B2：F1 权威池显式指仓库内基线（runner 无 /tmp/eng_wt，快照/判定轮必读）
      F1_POOL: ${{ github.workspace }}/engine_snapshot/cleaned_pool.json
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 装实测依赖
        run: |
          echo "| 步骤 | 结果 |" >> "$GITHUB_STEP_SUMMARY"
          pip install -q -r requirements.txt
          echo "| 装依赖 | ✅ numpy/pandas/requests |" >> "$GITHUB_STEP_SUMMARY"

      - name: 判定轮次（mode 输入 / auto 就近判定）
        id: round
        run: |
          MODE_IN="${{ inputs.mode || 'auto' }}"
          H=$(date -u +%H)
          if [ "$MODE_IN" != "auto" ]; then
            MODE="$MODE_IN"; ROUND="20:30"
          elif [ "$H" -ge 12 ] && [ "$H" -lt 16 ]; then
            MODE="snapshot"; ROUND="20:30"
          elif [ "$H" -ge 16 ] && [ "$H" -lt 20 ]; then
            MODE="snapshot"; ROUND="00:30"
          elif [ "$H" -ge 20 ]; then
            MODE="snapshot"; ROUND="04:30"
          else
            MODE="decision"; ROUND="08:30"
          fi
          echo "mode=$MODE"  >> "$GITHUB_OUTPUT"
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          echo "| 轮次判定 | ✅ $MODE${MODE:+（round $ROUND）} |" >> "$GITHUB_STEP_SUMMARY"

      - name: 拉行情（refresh_cache 全池刷新，失败保留旧缓存）
        run: |
          python3 research/wtc/refresh_cache.py
          OK=$(python3 -c "import json,os;r=json.load(open(os.environ['BOX_REFRESH_REPORT']));print(f\"{r['ok']}/{r['pool']}\")")
          echo "PULLED=$OK" >> "$GITHUB_ENV"
          echo "| 拉行情 | ✅ $OK 标的 |" >> "$GITHUB_STEP_SUMMARY"

      - name: 快照轮（只读盘中快照 → f1/f1_live_intraday.json）
        if: steps.round.outputs.mode == 'snapshot'
        run: |
          python3 f1/f1_signal.py snapshot --round "${{ steps.round.outputs.round }}" \
            --out f1/f1_live_intraday.json
          echo "| F1快照轮 | ✅ round=${{ steps.round.outputs.round }}（只读·禁写状态·禁出top5） |" >> "$GITHUB_STEP_SUMMARY"
          echo "F1_CARDS=0" >> "$GITHUB_ENV"; echo "BOX_TRADES=-" >> "$GITHUB_ENV"

      - name: 判定轮（live 完整日K + top5 + 熔断 + 箱体页）
        if: steps.round.outputs.mode == 'decision'
        run: |
          python3 f1/f1_signal.py live --out f1/f1_live.json
          python3 generate_page.py
          F1_CARDS=$(python3 -c "import json;d=json.load(open('f1/f1_live.json'));print(len(d['signal']['top5']))")
          BOX_TRADES=$(python3 -c "import json;d=json.load(open('box_live.json'));print(sum(v['stats']['total'] for v in d['runs'].values()))")
          echo "F1_CARDS=$F1_CARDS" >> "$GITHUB_ENV"
          echo "BOX_TRADES=$BOX_TRADES" >> "$GITHUB_ENV"
          echo "| F1判定轮 | ✅ top5=$F1_CARDS 熔断状态机已写 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 箱体页 | ✅ 近30日 $BOX_TRADES 笔 |" >> "$GITHUB_STEP_SUMMARY"

      - name: 归一化池计数
        run: |
          NORM=$(python3 -c "import json;print(len(json.load(open('engine_snapshot/cleaned_pool.json'))['kept']))")
          echo "NORM=$NORM" >> "$GITHUB_ENV"
          echo "| 归一化 | ✅ 清洗池 $NORM 标的 |" >> "$GITHUB_STEP_SUMMARY"

      - name: 生成文件列表与字节数
        run: |
          echo "| 产物 | ✅ 见下 |" >> "$GITHUB_STEP_SUMMARY"
          ls -la f1/f1_live*.json f1/f1_state.json box_live.json index.html 2>/dev/null | tee /tmp/artifacts.txt
          TS=$(date -u '+%F %T UTC')
          {
            echo ""
            echo "**产物清单（$TS）**"
            echo '```'
            cat /tmp/artifacts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交（有变更才提交；无变更=休市日正常空转）
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f1/f1_live.json f1/f1_live_intraday.json f1/f1_state.json \
                  f1/f1_source_state.json box_live.json index.html generate_page.py 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "| 提交 | ⏭️ 无变更（休市日属正常） |" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "refresh(${{ steps.round.outputs.mode }}): 拉取${PULLED} 归一化${NORM} F1卡${F1_CARDS} box笔${BOX_TRADES}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "| 提交 | ✅ $(git log -1 --format='%h %s') |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 推送（失败重试 3 次、间隔 60s；三连败显式报警）
        if: steps.commit.outputs.changed == 'true'
        run: |
          OK=0
          for i in 1 2 3; do
            if git push; then OK=1; break; fi
            if [ "$i" -lt 3 ]; then
              echo "push 第 ${i}/3 次失败，60s 后重试"
              sleep 60
            else
              echo "push 第 3/3 次失败"
            fi
          done
          if [ "$OK" != "1" ]; then
            echo "::error::push 重试 3 次全部失败——远端可能被并发占用或有分支保护，需人工介入"
            echo "| 推送 | ❌ 3 次重试全败（触发失败报警） |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "| 推送 | ✅ |" >> "$GITHUB_STEP_SUMMARY"

      - name: 金丝雀故障注入（fail_test=true 的一次性报警验证，平时恒跳过）
        if: ${{ inputs.fail_test == true }}
        run: |
          echo "| 金丝雀 | 💥 故意 exit 1 —— 本步失败即为报警链路验证通过预期 |" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::fail_test 金丝雀触发：本 job 应转红并向 watcher 发失败邮件（三层报警第①层实测）"
          exit 1
